[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Explicit because this site was originally created for a different
# framework (Astro) and Netlify's one-time framework auto-detection
# never re-ran when the repo was swapped to Next.js — without this the
# site gets served as static files and every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The placeholder project pages are gone — send any stale link to Convx
# instead of a 404, so link equity and bookmarks survive.
[[redirects]]
  from = "/projects"
  to = "/convx"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/convx"
  status = 301
